name: Elixir CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.14.0"
            otp: "25.3.2.21"
            consumer-ecto: "3.12.5"
          - elixir: "1.20.5"
            otp: "29.1.2"
            consumer-ecto: "~> 3.0"
            quality-checks: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Fetch test dependencies
        run: |
          mix deps.get --only test
          git diff --exit-code -- mix.lock
      - name: Run tests
        run: mix test

      - name: Check formatting
        if: matrix.quality-checks
        run: |
          mix format --check-formatted
          mix format --check-formatted compatibility/{mix,verify}.exs
      - name: Run Credo and build documentation
        if: matrix.quality-checks
        run: |
          mix deps.get --check-locked
          mix credo
          mix docs

      - name: Verify downstream fragment queries
        working-directory: compatibility
        env:
          ECTO_VERSION: ${{ matrix.consumer-ecto }}
          MIX_ENV: prod
        run: |
          mix deps.get
          mix run verify.exs
